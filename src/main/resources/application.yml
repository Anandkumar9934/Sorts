spring:
  application:
    name: driver-management-api
  
  # Database Configuration
  datasource:
    url: jdbc:h2:file:./driverdb
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  # H2 Console (for development only)
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true

# Security Configuration
security:
  jwt:
    secret: your-super-secret-jwt-key-that-should-be-at-least-256-bits-long
    expiration: 86400000 # 24 hours in milliseconds
  
  encryption:
    key: your-32-character-encryption-key-here
    algorithm: AES/GCM/NoPadding

# File Storage Configuration
file:
  storage:
    upload-dir: ./uploads/drivers
    encrypted-dir: ./uploads/encrypted

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api/v1

# Logging Configuration
logging:
  level:
    com.driverapi: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"